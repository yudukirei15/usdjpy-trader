<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDJPY Trader</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:sans-serif}
.app{padding:12px;max-width:900px;margin:auto}
.panel{background:#111c2e;padding:12px;border-radius:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;margin-top:6px;background:#0b1220;color:#fff;border:1px solid #2a3b56;border-radius:10px}
button{padding:12px;border:none;border-radius:10px;background:#5aa9ff;color:#000;font-weight:bold;width:100%}
img{width:100%;max-height:200px;object-fit:contain;background:#000;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="app"><h2>📖 FX Trade Diary</h2><div class="panel"><input type="date" id="date"><select id="setup">
<option>M15 bearish → M5 pullback</option>
<option>M15 bullish → M5 pullback</option>
<option>レンジ逆張り</option>
</select><div class="grid">
<input id="entry" placeholder="Entry">
<input id="sl" placeholder="SL">
<input id="tp" placeholder="TP">
<input id="pnl" placeholder="P&L">
</div><h4>📸 エントリー前</h4>
<input type="file" id="before">
<img id="beforePrev"><h4>📈 エントリー後</h4>
<input type="file" id="after">
<img id="afterPrev"><textarea id="reason" placeholder="エントリー理由"></textarea><label><input type="checkbox" class="chk"> M15方向OK</label>
<label><input type="checkbox" class="chk"> EMA一致</label>
<label><input type="checkbox" class="chk"> RR>=3</label>

<button onclick="save()">保存</button>

</div><div class="panel">
<h3>📊 統計</h3>
<div id="stats"></div>
</div><div id="list"></div></div><script>
let trades=JSON.parse(localStorage.getItem("trades")||"[]");

before.onchange=e=>{
 const f=e.target.files[0];
 const r=new FileReader();
 r.onload=()=>beforePrev.src=r.result;
 if(f)r.readAsDataURL(f);
};

after.onchange=e=>{
 const f=e.target.files[0];
 const r=new FileReader();
 r.onload=()=>afterPrev.src=r.result;
 if(f)r.readAsDataURL(f);
};

function save(){
 const pnl=Number(pnlInput());
 const result=pnl>0?"WIN":pnl<0?"LOSS":"BE";

 const checks=[...document.querySelectorAll(".chk")];
 const score=checks.filter(c=>c.checked).length/checks.length;

 const t={
  id:Date.now(),
  date:date.value,
  setup:setup.value,
  entry:entry.value,
  sl:sl.value,
  tp:tp.value,
  pnl:pnl,
  result:result,
  checkScore:score,
  before:beforePrev.src,
  after:afterPrev.src,
  reason:reason.value
 };

 trades.push(t);
 localStorage.setItem("trades",JSON.stringify(trades));
 render();
}

function pnlInput(){return document.getElementById("pnl").value||0;}

function render(){
 let win=0,loss=0,profit=0,lossSum=0,total=0;

 trades.forEach(t=>{
  total+=t.pnl;
  if(t.pnl>0){win++;profit+=t.pnl}
  if(t.pnl<0){loss++;lossSum+=Math.abs(t.pnl)}
 });

 let pf=lossSum?(profit/lossSum).toFixed(2):"-";

 stats.innerHTML=`
 総数:${trades.length}<br>
 勝率:${(win/trades.length*100||0).toFixed(1)}%<br>
 PF:${pf}<br>
 P&L:${total}
 `;

 list.innerHTML=trades.map(t=>`
 <div class="panel">
 ${t.date} ${t.setup}<br>
 ${t.result} ${t.pnl}<br>
 Score:${(t.checkScore*100).toFixed(0)}%<br>
 <img src="${t.before}">
 <img src="${t.after}">
 </div>
 `).join("");
}

render();
</script></body>
</html>
